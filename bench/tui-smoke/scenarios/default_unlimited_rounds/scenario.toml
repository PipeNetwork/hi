schema_version = 1
name = "default-unlimited-model-and-tool-rounds"
tags = ["curated", "pr"]
# This case intentionally performs 50 sequential model/tool/checkpoint cycles.
# Leave enough observation headroom for a loaded CI host; the action still
# proves every round completed and is not an execution budget for `hi`.
timeout_ms = 240000

[hi]
# The product default is intentionally uncapped. Verification is disabled by
# the harness so this case measures only model rounds and the 50 scripted writes.
# Fifty sequential calls deliberately crosses both historical defaults: 32 model
# rounds and 48 executed tools.
args = ["--allow-unverified"]
# Most scripted cases use the harness's explicit 30-second child deadline for
# fast fault containment. Disable it here so the regression actually exercises
# Hi's ordinary no-deadline default; the 240-second scenario timeout remains an
# external observer/cleanup boundary, not a product execution limit.
turn_deadline_secs = 0
# Keep a bounded external watchdog with enough room for the 180-second request
# observation plus settlement/cleanup. It never changes Hi's turn semantics.
outer_turn_kill_secs = 210

