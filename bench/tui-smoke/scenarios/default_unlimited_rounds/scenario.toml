[[actions]]
kind = "send_line"
text = "Create 50 small proof files named round-01.txt through round-50.txt, one write call at a time, then report completion."

[[actions]]
kind = "wait_provider_request"
count = 51
timeout_ms = 180000

[[actions]]
kind = "wait_event"
equals = { "/event" = "turn_settled", "/data/outcome/status" = "completed", "/data/outcome/verification" = "not_applicable", "/data/outcome/stop_reason" = "no_applicable_verification", "/data/outcome/changed_file_count" = 50, "/data/next_drive/action" = "idle", "/data/next_drive/reason" = "none" }
timeout_ms = 30000

[[actions]]
kind = "quit"

[[assertions]]
kind = "records"
source = "provider_requests"
equals = { "/method" = "POST" }
exact = 51

[[assertions]]
kind = "records"
source = "events"
equals = { "/event" = "turn_started", "/data/origin" = "user" }
exact = 1

[[assertions]]
kind = "records"
source = "events"
equals = { "/event" = "ui_event", "/data/kind" = "tool_started", "/data/name" = "write" }
exact = 50

[[assertions]]
kind = "records"
source = "events"
equals = { "/event" = "ui_event", "/data/kind" = "tool_call", "/data/name" = "write" }
exact = 50

[[assertions]]
kind = "records"
source = "events"
equals = { "/event" = "ui_event", "/data/kind" = "tool_result", "/data/name" = "write" }
exact = 50

[[assertions]]
kind = "records"
source = "events"
equals = { "/event" = "turn_settled", "/data/step_limit/mode" = "unlimited", "/data/outcome/status" = "completed", "/data/outcome/verification" = "not_applicable", "/data/outcome/stop_reason" = "no_applicable_verification", "/data/outcome/changed_file_count" = 50, "/data/next_drive/action" = "idle", "/data/next_drive/reason" = "none" }
exact = 1

[[assertions]]
kind = "records"
source = "events"
equals = { "/event" = "drive_parked" }
exact = 0

[[assertions]]
kind = "records"
source = "session"
equals = { "/role" = "Assistant" }
contains = { "/content/0/Text" = "DEFAULT_UNLIMITED_ROUNDS_COMPLETE" }
exact = 1

[[assertions]]
kind = "file"
path = "round-01.txt"
exists = true
equals = "round 01 complete\n"

[[assertions]]
kind = "file"
path = "round-17.txt"
exists = true
equals = "round 17 complete\n"

[[assertions]]
kind = "file"
path = "round-50.txt"
exists = true
equals = "round 50 complete\n"

[[assertions]]
kind = "provider_consumed"

[[assertions]]
kind = "exit"
code = 0
