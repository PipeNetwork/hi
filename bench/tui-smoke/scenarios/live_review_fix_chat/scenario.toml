schema_version = 1
name = "live-review-fix-chat"
tags = ["live_extended"]
timeout_ms = 1800000

[terminal]
cols = 132
rows = 40

[workspace]
fixture = "fixture"
git = "clean"

[hi]
# Large enough for a real review/fix/verify loop against Pipe: several
# model rounds, edits, and cargo-test repairs. Turn deadline is off so the
# 14-minute outer watchdog is the only wall; 0 is the documented continual-
# work escape hatch.
args = [
  "--allow-unverified",
  "--no-memory",
  "--no-finalize",
  "--temperature",
  "0",
  "--max-tokens",
  "16384",
  "--max-steps",
  "80",
  "--max-verify-repairs",
  "8",
  "--verify",
  "cargo test --offline",
]
turn_deadline_secs = 0
outer_turn_kill_secs = 840

[[actions]]
kind = "send_line"
text = """Review this IRC-style chat server for major correctness bugs and fix them.

Read tests/integration.rs and src/main.rs first. The integration tests fail today.

Do not use bash or any other shell. Use read, grep, and edit/write only. cargo test --offline runs automatically after your edits.

Keep the existing tests; do not weaken or delete them. Make the tests pass by fixing the server."""

[[actions]]
kind = "wait_event"
equals = { "/event" = "turn_started", "/data/origin" = "user" }
timeout_ms = 240000

[[actions]]
kind = "wait_event"
equals = { "/event" = "turn_settled" }
timeout_ms = 840000

[[actions]]
kind = "wait_quiescent"
source = "events"
quiet_ms = 750
timeout_ms = 30000

[[actions]]
kind = "send_line"
text = "Run cargo test to verify the welcome-message change didn't break anything."

[[actions]]
kind = "wait_event"
equals = { "/event" = "turn_started", "/data/origin" = "user" }
timeout_ms = 240000

[[actions]]
kind = "wait_event"
equals = { "/event" = "turn_settled" }
timeout_ms = 840000

[[actions]]
kind = "wait_quiescent"
source = "events"
quiet_ms = 750
timeout_ms = 30000

[[actions]]
kind = "quit"

[[assertions]]
kind = "records"
source = "events"
equals = { "/event" = "turn_started", "/data/origin" = "user" }
exact = 2

[[assertions]]
kind = "records"
source = "events"
equals = { "/event" = "turn_settled", "/data/outcome/status" = "completed" }
exact = 2

[[assertions]]
kind = "records"
source = "events"
equals = { "/event" = "turn_settled", "/data/outcome/stop_reason" = "no_progress" }
exact = 0

[[assertions]]
kind = "records"
source = "events"
equals = { "/event" = "ui_event", "/data/kind" = "tool_started" }
at_least = 2

[[assertions]]
kind = "records"
source = "events"
equals = { "/event" = "approval_shown" }
exact = 0

[[assertions]]
kind = "records"
source = "provider_requests"
equals = { "/accepted" = true, "/response_status" = 200 }
at_least = 2

[[assertions]]
kind = "file"
path = "tests/integration.rs"
exists = true
contains = "read_until(\"Welcome\")"

[[assertions]]
kind = "file"
path = "tests/integration.rs"
exists = true
contains = "after kick"

[[assertions]]
kind = "file"
path = "src/main.rs"
exists = true
contains = "TcpListener"

[[assertions]]
kind = "workspace_listing"
contains = ["src/main.rs", "tests/integration.rs", "Cargo.toml"]

[[assertions]]
kind = "exit"
code = 0
