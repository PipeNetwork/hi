schema_version = 1
name = "interrupted-plan-user-prompt-resumes"
tags = ["curated", "pr", "resume-regression"]
timeout_ms = 45000

[hi]
args = ["--allow-unverified"]

# Start manually paused so the first request is deterministic. `/plan resume`
# begins a synthetic turn; cancelling that turn must persist the distinct
# interruption latch which the later ordinary user prompt consumes.
[session]
plan_drive_paused = true
plan_drive_resume_on_user_input = false

[[session.plan]]
title = "Resume the interrupted implementation"
status = "active"

[[session.plan]]
title = "Continue the remaining checklist automatically"
status = "pending"

[[provider.steps]]
id = "initial-held-plan-drive"
[provider.steps.response]
kind = "hold"
gate = "initial-held-plan-drive"

[[provider.steps]]
id = "real-user-resume-write"
[provider.steps.expect]
body_contains = ["Resume this interrupted work by creating user-resumed.txt"]
[provider.steps.response]
kind = "tool_call"
name = "write"
arguments = { path = "user-resumed.txt", content = "USER_PROMPT_RESUMED_PLAN\n" }
gate = "active-user-resume"

[[provider.steps]]
id = "real-user-reconciles-existing-plan"
[provider.steps.expect]
body_contains = ["user-resumed.txt", "USER_PROMPT_RESUMED_PLAN"]
[provider.steps.response]
kind = "tool_call"
name = "update_plan"
arguments = { steps = [{ title = "Resume the interrupted implementation", status = "done", completion_evidence = "Created user-resumed.txt containing USER_PROMPT_RESUMED_PLAN in this turn." }, { title = "Continue the remaining checklist automatically", status = "pending" }] }

[[provider.steps]]
id = "generic-after-user-resume"
[provider.steps.response]
kind = "text"
text = "Completed the requested action."

[[provider.steps]]
id = "generic-user-resume-retry"
[provider.steps.expect]
body_contains = ["actual result"]
[provider.steps.response]
kind = "text"
text = "Completed the requested action."

[[provider.steps]]
id = "automatic-follow-up-proves-unpaused"
[provider.steps.expect]
body_contains = ["Continue the remaining checklist automatically"]
[provider.steps.response]
kind = "hold"
gate = "automatic-follow-up"

[[actions]]
kind = "send_line"
text = "/plan resume"

[[actions]]
kind = "wait_provider_request"
count = 1
timeout_ms = 10000

[[actions]]
kind = "send_key"
key = "ctrl_c"

[[actions]]
kind = "wait_event"
equals = { "/event" = "drive_paused", "/data/kind" = "plan_drive" }
timeout_ms = 10000

[[actions]]
kind = "release_gate"
gate = "initial-held-plan-drive"

[[actions]]
kind = "restart"

[[actions]]
kind = "wait_event_absent"
equals = { "/event" = "turn_started", "/data/origin" = "plan_drive" }
duration_ms = 500

[[actions]]
kind = "send_line"
text = "Resume this interrupted work by creating user-resumed.txt containing USER_PROMPT_RESUMED_PLAN."

[[actions]]
kind = "wait_event"
equals = { "/event" = "turn_started", "/data/origin" = "user", "/data/plan/paused" = false }
timeout_ms = 10000

[[actions]]
kind = "wait_provider_request"
count = 2
timeout_ms = 10000

[[actions]]
kind = "capture_screen"
name = "active_user_without_stale_pause"

[[actions]]
kind = "release_gate"
gate = "active-user-resume"

[[actions]]
kind = "wait_provider_request"
count = 5
timeout_ms = 15000

[[actions]]
kind = "wait_event"
equals = { "/event" = "turn_settled", "/data/outcome/status" = "completed", "/data/plan/paused" = false, "/data/next_drive/action" = "enqueue", "/data/next_drive/kind" = "plan_drive" }
timeout_ms = 10000

[[actions]]
kind = "wait_event"
equals = { "/event" = "turn_started", "/data/origin" = "plan_drive", "/data/plan/paused" = false }
timeout_ms = 10000

[[actions]]
kind = "wait_provider_request"
count = 6
timeout_ms = 10000

[[actions]]
kind = "capture_screen"
name = "resumed_without_stale_pause"

[[actions]]
kind = "send_key"
key = "ctrl_c"

[[actions]]
kind = "wait_event"
equals = { "/event" = "turn_settled", "/data/outcome/status" = "cancelled" }
timeout_ms = 10000

[[actions]]
kind = "release_gate"
gate = "automatic-follow-up"

[[actions]]
kind = "quit"

[[assertions]]
kind = "records"
source = "events"
equals = { "/event" = "ready" }
exact = 2

[[assertions]]
kind = "record_sequence"
source = "events"
where_equals = { "/event" = "turn_started" }
pointer = "/data/origin"
values = ["plan_drive", "user", "plan_drive"]

[[assertions]]
kind = "records"
source = "events"
equals = { "/event" = "turn_started", "/data/origin" = "user", "/data/plan/paused" = false }
exact = 1

[[assertions]]
kind = "records"
source = "events"
equals = { "/event" = "turn_settled", "/data/outcome/status" = "completed", "/data/plan/paused" = false, "/data/next_drive/action" = "enqueue", "/data/next_drive/kind" = "plan_drive" }
exact = 1

[[assertions]]
kind = "records"
source = "session"
equals = { "/type" = "plan_drive", "/paused" = true, "/resume_on_user_input" = true }
at_least = 2

[[assertions]]
kind = "records"
source = "session"
equals = { "/type" = "plan_drive", "/paused" = false, "/resume_on_user_input" = false }
at_least = 1

[[assertions]]
kind = "screen"
snapshot = "resumed_without_stale_pause"
contains = ["plan · 1/2"]
excludes = ["plan · 1/2 · paused"]

[[assertions]]
kind = "screen"
snapshot = "active_user_without_stale_pause"
contains = ["plan"]
excludes = ["· paused"]

[[assertions]]
kind = "file"
path = "user-resumed.txt"
exists = true
equals = "USER_PROMPT_RESUMED_PLAN\n"

[[assertions]]
kind = "records"
source = "provider_requests"
equals = { "/method" = "POST" }
exact = 6

[[assertions]]
kind = "provider_consumed"

[[assertions]]
kind = "exit"
code = 0
