schema_version = 1
name = "http-503-bounded-recovery"
tags = ["curated", "pr"]
timeout_ms = 45000

[[provider.steps]]
id = "temporary-503"
[provider.steps.response]
kind = "http_error"
status = 503
body = '{"error":{"message":"scripted service unavailable","code":"service_unavailable","retryable":true,"retry_after_seconds":1}}'

[[provider.steps]]
id = "recovered-answer"
[provider.steps.response]
kind = "text"
text = "The provider recovered after one bounded retry."

[[actions]]
kind = "send_line"
text = "Demonstrate bounded recovery from a temporary provider outage."

[[actions]]
kind = "wait_provider_request"
count = 2
timeout_ms = 15000

[[actions]]
kind = "wait_event"
equals = { "/event" = "turn_settled", "/data/outcome/status" = "completed" }
timeout_ms = 15000

[[actions]]
kind = "quit"

[[assertions]]
kind = "records"
source = "provider_requests"
equals = { "/method" = "POST" }
exact = 2

[[assertions]]
kind = "records"
source = "events"
equals = { "/event" = "turn_settled", "/data/outcome/status" = "completed" }
exact = 1

[[assertions]]
kind = "provider_consumed"

[[assertions]]
kind = "exit"
code = 0
