schema_version = 1
name = "productive-investigation-plan-drive"
tags = ["curated", "pr", "productive-investigation-regression"]
timeout_ms = 60000

[workspace]
fixture = "fixture"
git = "clean"

[hi]
# Verification is outside this regression's scope. The case isolates the
# plan-drive progress classifier and its four-turn no-progress park guard.
args = ["--allow-unverified"]

[[session.plan]]
title = "Investigate the lifecycle evidence, then record the conclusion"
status = "pending"

# Every work round advances inspection or satisfies the requested effect.
[[provider.steps]]
id = "read-alpha"
[provider.steps.response]
kind = "tool_call"
name = "read"
arguments = { path = "evidence-01.txt" }

[[provider.steps]]
id = "search-beta"
[provider.steps.response]
kind = "tool_call"
name = "grep"
arguments = { pattern = "BETA_QUEUE", path = "." }

[[provider.steps]]
id = "read-gamma"
[provider.steps.response]
kind = "tool_call"
name = "read"
arguments = { path = "evidence-03.txt" }

[[provider.steps]]
id = "search-delta"
[provider.steps.response]
kind = "tool_call"
name = "grep"
arguments = { pattern = "DELTA_RESTART", path = "." }

[[provider.steps]]
id = "read-epsilon"
[provider.steps.response]
kind = "tool_call"
name = "read"
arguments = { path = "evidence-05.txt" }

[[provider.steps]]
id = "write-conclusion"
[provider.steps.response]
kind = "tool_call"
name = "write"
arguments = { path = "investigation-complete.txt", content = "ALPHA_ROUTE\nBETA_QUEUE\nGAMMA_SETTLEMENT\nDELTA_RESTART\nEPSILON_CLEANUP\n" }

[[provider.steps]]
id = "complete-plan"
[provider.steps.expect]
body_contains = ["investigation-complete.txt"]
[provider.steps.response]
kind = "tool_call"
name = "update_plan"
arguments = { steps = [{ title = "Investigate the lifecycle evidence, then record the conclusion", status = "done" }] }

[[actions]]
kind = "wait_provider_request"
count = 7
timeout_ms = 30000

[[actions]]
kind = "wait_event"
equals = { "/event" = "turn_settled", "/data/outcome/status" = "completed", "/data/outcome/changed_file_count" = 1, "/data/plan/incomplete" = false, "/data/next_drive/action" = "idle" }
timeout_ms = 30000

[[actions]]
kind = "quit"

[[assertions]]
kind = "records"
source = "events"
equals = { "/event" = "turn_started", "/data/origin" = "plan_drive" }
exact = 1

[[assertions]]
kind = "records"
source = "events"
equals = { "/event" = "turn_settled", "/data/outcome/status" = "completed", "/data/outcome/changed_file_count" = 1, "/data/plan/incomplete" = false, "/data/plan/stall" = 0, "/data/next_drive/action" = "idle", "/data/next_drive/reason" = "none" }
exact = 1

[[assertions]]
kind = "records"
source = "events"
equals = { "/event" = "drive_parked", "/data/kind" = "plan_drive" }
exact = 0

[[assertions]]
kind = "records"
source = "events"
equals = { "/event" = "ui_event", "/data/kind" = "tool_call", "/data/name" = "read" }
exact = 3

[[assertions]]
kind = "records"
source = "events"
equals = { "/event" = "ui_event", "/data/kind" = "tool_call", "/data/name" = "grep" }
exact = 2

[[assertions]]
kind = "records"
source = "provider_requests"
equals = { "/method" = "POST" }
exact = 7

[[assertions]]
kind = "file"
path = "investigation-complete.txt"
exists = true
equals = "ALPHA_ROUTE\nBETA_QUEUE\nGAMMA_SETTLEMENT\nDELTA_RESTART\nEPSILON_CLEANUP\n"

[[assertions]]
kind = "provider_consumed"

[[assertions]]
kind = "exit"
code = 0
