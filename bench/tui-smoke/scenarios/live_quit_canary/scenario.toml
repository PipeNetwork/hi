schema_version = 1
name = "live-settle-and-quit-canary"
tags = ["live"]
timeout_ms = 600000

[[actions]]
kind = "send_line"
text = "Answer the arithmetic expression 2 + 2 in one short line. Do not use tools."

[[actions]]
kind = "wait_event"
equals = { "/event" = "turn_settled" }
# The child turn deadline is 240s. Leave a 30s evidence-flush grace period
# before the harness's independent 300s outer-turn watchdog.
timeout_ms = 270000

[[actions]]
kind = "wait_quiescent"
source = "events"
quiet_ms = 250
timeout_ms = 30000

[[actions]]
kind = "quit"

[[assertions]]
kind = "record_sequence"
source = "events"
pointer = "/event"
values = ["ready", "turn_started", "turn_settled", "session_ended"]

[[assertions]]
kind = "records"
source = "events"
equals = { "/event" = "turn_settled", "/data/outcome/status" = "completed", "/data/outcome/changed_file_count" = 0 }
exact = 1

[[assertions]]
kind = "records"
source = "events"
equals = { "/event" = "ui_event", "/data/kind" = "tool_started" }
exact = 0

[[assertions]]
kind = "records"
source = "events"
equals = { "/event" = "approval_shown" }
exact = 0

[[assertions]]
kind = "records"
source = "provider_requests"
equals = { "/accepted" = true, "/response_status" = 200 }
at_least = 1

[[assertions]]
kind = "records"
source = "session"
equals = { "/role" = "Assistant" }
exact = 1

[[assertions]]
kind = "exit"
code = 0
