schema_version = 1
name = "implementation-read-loop-recovers-to-mutation"
tags = ["curated", "pr", "implementation-read-loop-regression"]
timeout_ms = 45000

[workspace]
fixture = "fixture"
git = "clean"

[hi]
# Verification is not the subject of this regression. The real PTY lifecycle,
# provider transcript reset, workspace mutation, and durable plan state are.
args = ["--allow-unverified"]

[[session.plan]]
title = "Implement the recovered lifecycle marker in recovery-complete.txt"
status = "pending"

# Turn 1: one novel read is allowed as orientation for an implementation step.
[[provider.steps]]
id = "orientation-read"
[provider.steps.expect]
body_contains = ["Implement the recovered lifecycle marker"]
body_excludes = ["[hi:plan-recovery]"]
[provider.steps.response]
kind = "tool_call"
name = "read"
arguments = { path = "orientation-01.txt" }

[[provider.steps]]
id = "orientation-report"
[provider.steps.expect]
body_contains = ["ORIENTATION_POISON_RAW"]
[provider.steps.response]
kind = "text"
text = "FIRST_LOOP_POISON_TEXT: the legacy dispatcher evidence was inspected, but this orientation turn did not edit the workspace."

[[provider.steps]]
id = "orientation-settle-2"
[provider.steps.response]
kind = "text"
text = "The first targeted source established the dispatcher path; implementation remains pending for a later drive."

[[provider.steps]]
id = "orientation-settle-3"
[provider.steps.response]
kind = "text"
text = "This orientation result is concrete read evidence, while recovery-complete.txt is still absent."

[[provider.steps]]
id = "orientation-settle-4"
[provider.steps.response]
kind = "text"
text = "The first inspection is complete and no plan status or workspace file changed during it."

[[provider.steps]]
id = "orientation-settle-5"
[provider.steps.response]
kind = "text"
text = "End the orientation pass with the implementation step still pending for the next automatic drive."

# Turn 2: this is genuinely novel evidence, but a second read-only turn on an
# implementation step must increment the semantic stall instead of resetting it.
[[provider.steps]]
id = "later-novel-read"
[provider.steps.expect]
body_contains = ["ORIENTATION_POISON_RAW"]
body_excludes = ["[hi:plan-recovery]"]
[provider.steps.response]
kind = "tool_call"
name = "read"
arguments = { path = "orientation-02.txt" }

[[provider.steps]]
id = "later-novel-report"
[provider.steps.expect]
body_contains = ["SECOND_POISON_RAW"]
[provider.steps.response]
kind = "text"
text = "SECOND_LOOP_POISON_TEXT: a different file supplied new target evidence, but this drive also made no mutation."

[[provider.steps]]
id = "later-novel-settle-2"
[provider.steps.response]
kind = "text"
text = "The second distinct source confirms the required marker while the implementation remains unfinished."

[[provider.steps]]
id = "later-novel-settle-3"
[provider.steps.response]
kind = "text"
text = "Novel offsets and files alone cannot finish this implementation-shaped checklist step."

[[provider.steps]]
id = "later-novel-settle-4"
[provider.steps.response]
kind = "text"
text = "This second inspection changed neither recovery-complete.txt nor the structured plan."

[[provider.steps]]
id = "later-novel-settle-5"
[provider.steps.response]
kind = "text"
text = "End the second read-only pass so the next drive can switch to a concrete implementation strategy."

# Turn 3: stall=1 forces a fresh strategy epoch. Both requests in the recovered
# turn must carry its mutation-oriented instruction, while the strict matchers
# reject either poisoned raw tool output leaking through the reset transcript.
[[provider.steps]]
id = "recovery-write"
[provider.steps.expect]
body_contains = ["[hi:plan-recovery]", "make the smallest safe mutation", "Implement the recovered lifecycle marker"]
body_excludes = ["ORIENTATION_POISON_RAW", "SECOND_POISON_RAW", "FIRST_LOOP_POISON_TEXT", "SECOND_LOOP_POISON_TEXT"]
[provider.steps.response]
kind = "tool_call"
name = "write"
arguments = { path = "recovery-complete.txt", content = "RECOVERY_MUTATION_OK\n" }

[[provider.steps]]
id = "recovery-complete-plan"
[provider.steps.expect]
body_contains = ["[hi:plan-recovery]", "make the smallest safe mutation", "recovery-complete.txt", "RECOVERY_MUTATION_OK"]
body_excludes = ["ORIENTATION_POISON_RAW", "SECOND_POISON_RAW", "FIRST_LOOP_POISON_TEXT", "SECOND_LOOP_POISON_TEXT"]
[provider.steps.response]
kind = "tool_call"
name = "update_plan"
arguments = { steps = [{ title = "Implement the recovered lifecycle marker in recovery-complete.txt", status = "done", completion_evidence = "Created recovery-complete.txt containing RECOVERY_MUTATION_OK during this recovered turn." }] }

[[actions]]
kind = "wait_provider_request"
count = 14
timeout_ms = 30000

[[actions]]
kind = "wait_event"
equals = { "/event" = "turn_settled", "/data/outcome/status" = "completed", "/data/outcome/changed_file_count" = 1, "/data/plan/incomplete" = false, "/data/plan/stall" = 0, "/data/next_drive/action" = "idle", "/data/next_drive/reason" = "none" }
timeout_ms = 10000

[[actions]]
kind = "wait_quiescent"
source = "provider"
quiet_ms = 500
timeout_ms = 3000

[[actions]]
kind = "quit"

# Typed lifecycle order: orientation succeeds, the second novel inspection
# increments stall, then the recovered mutation clears the plan and stall.
[[assertions]]
kind = "record_sequence"
source = "events"
where_equals = { "/event" = "turn_started" }
pointer = "/data/origin"
values = ["plan_drive", "plan_drive", "plan_drive"]

[[assertions]]
kind = "record_sequence"
source = "events"
where_equals = { "/event" = "turn_settled" }
pointer = "/data/plan/stall"
values = [0, 1, 0]

[[assertions]]
kind = "records"
source = "events"
equals = { "/event" = "turn_started", "/data/origin" = "plan_drive" }
exact = 3

[[assertions]]
kind = "records"
source = "events"
equals = { "/event" = "turn_settled", "/data/outcome/status" = "completed", "/data/outcome/changed_file_count" = 0, "/data/plan/incomplete" = true, "/data/plan/stall" = 0, "/data/next_drive/action" = "enqueue", "/data/next_drive/kind" = "plan_drive" }
exact = 1

[[assertions]]
kind = "records"
source = "events"
equals = { "/event" = "turn_settled", "/data/outcome/status" = "completed", "/data/outcome/changed_file_count" = 0, "/data/plan/incomplete" = true, "/data/plan/stall" = 1, "/data/next_drive/action" = "enqueue", "/data/next_drive/kind" = "plan_drive" }
exact = 1

[[assertions]]
kind = "records"
source = "events"
equals = { "/event" = "turn_settled", "/data/outcome/status" = "completed", "/data/outcome/changed_file_count" = 1, "/data/plan/incomplete" = false, "/data/plan/stall" = 0, "/data/next_drive/action" = "idle", "/data/next_drive/reason" = "none" }
exact = 1

[[assertions]]
kind = "records"
source = "events"
equals = { "/event" = "ui_event", "/data/kind" = "tool_call", "/data/name" = "read" }
exact = 2

[[assertions]]
kind = "records"
source = "events"
equals = { "/event" = "ui_event", "/data/kind" = "tool_call", "/data/name" = "write" }
exact = 1

[[assertions]]
kind = "records"
source = "events"
equals = { "/event" = "ui_event", "/data/kind" = "tool_call", "/data/name" = "update_plan" }
exact = 1

[[assertions]]
kind = "records"
source = "events"
equals = { "/event" = "drive_parked", "/data/kind" = "plan_drive" }
exact = 0

# Script order is strict in ScriptedOpenAiServer; exact count prevents an
# unbounded retry or an extra autonomous drive from hiding behind it.
[[assertions]]
kind = "records"
source = "provider_requests"
equals = { "/method" = "POST" }
exact = 14

[[assertions]]
kind = "records"
source = "provider_requests"
contains = { "/body" = "[hi:plan-recovery]" }
exact = 2

[[assertions]]
kind = "record_sequence"
source = "session"
where_equals = { "/type" = "plan_drive" }
pointer = "/stall"
values = [0, 1, 0]

[[assertions]]
kind = "records"
source = "session"
equals = { "/type" = "plan_cleared" }
exact = 1

[[assertions]]
kind = "records"
source = "events"
equals = { "/event" = "session_ended", "/data/queue_depth" = 0, "/data/plan/incomplete" = false, "/data/plan/stall" = 0 }
exact = 1

[[assertions]]
kind = "file"
path = "recovery-complete.txt"
exists = true
equals = "RECOVERY_MUTATION_OK\n"

[[assertions]]
kind = "workspace_patch"
contains = ["diff --git a/recovery-complete.txt b/recovery-complete.txt", "+RECOVERY_MUTATION_OK"]
excludes = ["orientation-01.txt", "orientation-02.txt"]

[[assertions]]
kind = "workspace_listing"
contains = ["./orientation-01.txt", "./orientation-02.txt", "./recovery-complete.txt"]

[[assertions]]
kind = "provider_consumed"

[[assertions]]
kind = "exit"
code = 0
