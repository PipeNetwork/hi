schema_version = 1
name = "explicit-two-model-round-cap"
tags = ["curated", "pr"]
timeout_ms = 30000

[hi]
# A finite cap remains available only when the operator opts into it.
args = ["--max-steps=2", "--allow-unverified"]

[[provider.steps]]
id = "capped-write-01"
[provider.steps.response]
kind = "tool_call"
name = "write"
arguments = { path = "capped-01.txt", content = "capped round 01 complete\n" }

[[provider.steps]]
id = "capped-write-02"
[provider.steps.response]
kind = "tool_call"
name = "write"
arguments = { path = "capped-02.txt", content = "capped round 02 complete\n" }

[[provider.steps]]
id = "typed-tool-free-wrap-up"
[provider.steps.expect]
json_equals = { "/tool_choice" = "none" }
[provider.steps.response]
kind = "text"
text = "EXPLICIT_STEP_CAP_WRAP_UP: two files completed; capped-03.txt remains unfinished."

[[actions]]
kind = "send_line"
text = "Create capped-01.txt, capped-02.txt, and capped-03.txt in separate write calls, then report completion."

[[actions]]
kind = "wait_provider_request"
count = 3
timeout_ms = 15000

[[actions]]
kind = "wait_event"
equals = { "/event" = "turn_settled", "/data/outcome/status" = "failed", "/data/outcome/verification" = "not_applicable", "/data/outcome/stop_reason" = "step_limit", "/data/outcome/changed_file_count" = 2, "/data/next_drive/action" = "idle", "/data/next_drive/reason" = "none" }
timeout_ms = 15000

[[actions]]
kind = "quit"

[[assertions]]
kind = "records"
source = "provider_requests"
equals = { "/method" = "POST" }
exact = 3

[[assertions]]
kind = "records"
source = "events"
equals = { "/event" = "turn_started", "/data/origin" = "user" }
exact = 1

[[assertions]]
kind = "records"
source = "events"
equals = { "/event" = "ui_event", "/data/kind" = "tool_started", "/data/name" = "write" }
exact = 2

[[assertions]]
kind = "records"
source = "events"
equals = { "/event" = "ui_event", "/data/kind" = "tool_call", "/data/name" = "write" }
exact = 2

[[assertions]]
kind = "records"
source = "events"
equals = { "/event" = "ui_event", "/data/kind" = "tool_result", "/data/name" = "write" }
exact = 2

[[assertions]]
kind = "records"
source = "events"
equals = { "/event" = "turn_settled", "/data/step_limit/mode" = "finite", "/data/step_limit/max_steps" = 2, "/data/outcome/status" = "failed", "/data/outcome/verification" = "not_applicable", "/data/outcome/stop_reason" = "step_limit", "/data/outcome/changed_file_count" = 2, "/data/next_drive/action" = "idle", "/data/next_drive/reason" = "none" }
exact = 1

[[assertions]]
kind = "records"
source = "session"
equals = { "/role" = "Assistant" }
contains = { "/content/0/Text" = "EXPLICIT_STEP_CAP_WRAP_UP" }
exact = 1

[[assertions]]
kind = "file"
path = "capped-01.txt"
exists = true
equals = "capped round 01 complete\n"

[[assertions]]
kind = "file"
path = "capped-02.txt"
exists = true
equals = "capped round 02 complete\n"

[[assertions]]
kind = "file"
path = "capped-03.txt"
exists = false

[[assertions]]
kind = "provider_consumed"

[[assertions]]
kind = "exit"
code = 0
