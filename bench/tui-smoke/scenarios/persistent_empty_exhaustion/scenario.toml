schema_version = 1
name = "persistent-empty-exhausts-recovery-budget"
tags = ["curated", "pr"]
timeout_ms = 30000

[[provider.steps]]
id = "empty-primary"
[provider.steps.response]
kind = "raw_sse"
body = "data: [DONE]\n\n"

[[provider.steps]]
id = "empty-retry-1"
[provider.steps.response]
kind = "raw_sse"
body = "data: [DONE]\n\n"

[[provider.steps]]
id = "empty-retry-2"
[provider.steps.response]
kind = "raw_sse"
body = "data: [DONE]\n\n"

[[provider.steps]]
id = "empty-keep-working-primary"
[provider.steps.response]
kind = "raw_sse"
body = "data: [DONE]\n\n"

[[provider.steps]]
id = "empty-keep-working-retry-1"
[provider.steps.response]
kind = "raw_sse"
body = "data: [DONE]\n\n"

[[provider.steps]]
id = "empty-keep-working-retry-2"
[provider.steps.response]
kind = "raw_sse"
body = "data: [DONE]\n\n"

[[actions]]
kind = "send_line"
text = "Reply with a short acknowledgement without using tools."

[[actions]]
kind = "wait_provider_request"
count = 6
timeout_ms = 15000

[[actions]]
kind = "wait_event"
equals = { "/event" = "turn_settled", "/data/outcome/status" = "failed", "/data/outcome/stop_reason" = "infrastructure_failure" }
timeout_ms = 15000

[[actions]]
kind = "wait_quiescent"
source = "provider"
quiet_ms = 300
timeout_ms = 3000

[[actions]]
kind = "quit"

[[assertions]]
kind = "records"
source = "provider_requests"
equals = { "/method" = "POST" }
exact = 6

[[assertions]]
kind = "records"
source = "events"
equals = { "/event" = "turn_started", "/data/origin" = "user" }
exact = 1

[[assertions]]
kind = "records"
source = "events"
equals = { "/event" = "turn_settled", "/data/outcome/status" = "failed", "/data/outcome/stop_reason" = "infrastructure_failure", "/data/next_drive/action" = "idle", "/data/next_drive/reason" = "infrastructure" }
exact = 1

[[assertions]]
kind = "provider_consumed"

[[assertions]]
kind = "exit"
code = 0
