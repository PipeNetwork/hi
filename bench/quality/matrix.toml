# Living first-tool quality matrix. Status is the product backlog for routing,
# not a second copy of judge.toml. CI checks every quality task has a row and
# every row has a task. First-tool / forbid lists live in each judge.toml.
schema_version = 1

[[row]]
id = "local-discovery"
category = "local_search"
coverage = "tape_and_live"
baseline = "passing"
notes = "Locked tapes grep. Catalog-trial first-tooled bash ls (one-trial variance)."

[[row]]
id = "inspect-before-ask"
category = "ask_user_misuse"
coverage = "tape_and_live"
baseline = "passing"
notes = "Live first tool bash pwd && ls. Judge allows bash after that trial."

