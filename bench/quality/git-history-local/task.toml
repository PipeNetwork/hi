schema_version = 2
allowed_changes = ["answer.txt"]
name = "git-history-local"
prompt = """What is the latest commit subject in this checkout? Write it as the only line of answer.txt. Use local git, not the web, and do not ask the user."""
[timeouts]
candidate_seconds = 900
visible_feedback_seconds = 120
oracle_seconds = 120

[final_oracle]
command = '''python3 -c "p=open('answer.txt').read(); assert 'seed: quality-zx9-fixture' in p"'''
