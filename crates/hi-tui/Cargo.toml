[package]
name = "hi-tui"
edition.workspace = true
version.workspace = true

[dependencies]
hi-harness.workspace = true
hi-events.workspace = true
hi-policy.workspace = true
hi-ai.workspace = true
hi-diff.workspace = true
hi-tools.workspace = true
hi-workflow.workspace = true
hi-voice = { workspace = true }
serde.workspace = true
serde_json.workspace = true
ratatui = { workspace = true, features = ["unstable-rendered-line-info"] }
crossterm.workspace = true
unicode-width.workspace = true
futures-util.workspace = true
tokio.workspace = true
tokio-util.workspace = true
anyhow.workspace = true
blake3.workspace = true
chrono.workspace = true
ansi-to-tui.workspace = true
reqwest = { workspace = true }
tracing.workspace = true
libc.workspace = true
eye-declare = { package = "eye_declare", version = "0.7", optional = true }
ratatui-core = { version = "0.1", optional = true }


[lints.rust]
# Real unsafe lives here (env set_var in single-threaded TUI cmd path); see workspace root.
unsafe_code = "allow"
# The Pipe session loop left Agent TUI chrome in place; fields and helpers
# that the new drive does not read are follow-up cleanup, not a compile gate.
dead_code = "allow"

[features]
# Voice dictation (microphone + local Whisper) is opt-in so ordinary TUI builds
# do not compile the heavy native audio stack.
default = []
voice = ["hi-voice/audio"]
codebase-graph = ["hi-tools/codebase-graph"]
eye-declare-spike = ["dep:eye-declare", "dep:ratatui-core"]
# INTERNAL SMOKE NEGATIVE CONTROL ONLY. This intentionally lets rejected
# generic completion text reach the transcript. Never enable it in normal,
# packaged, or release binaries.
smoke-negative-control-disable-generic-completion-guards = []

[dev-dependencies]
criterion.workspace = true
tempfile.workspace = true

[[bench]]
name = "tui_render"
harness = false

[[example]]
name = "eye_declare_spike"
required-features = ["eye-declare-spike"]
