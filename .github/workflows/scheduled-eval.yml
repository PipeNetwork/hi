name: Scheduled core evaluation

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  HI_EVAL_CONCURRENCY: "4"

concurrency:
  group: scheduled-core-eval
  cancel-in-progress: false

jobs:
  evaluate:
    runs-on: ubuntu-latest
    # GitHub-hosted jobs have a six-hour execution limit.
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v5
      - name: Install Linux build dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libasound2-dev
      - uses: dtolnay/rust-toolchain@1.96.0
      - uses: Swatinem/rust-cache@v2

      - name: Build core binaries
        run: cargo build --release -p hi -p hi-eval

      - name: Run full immutable-oracle suite (three trials)
        env:
          HI_BIN: target/release/hi
          HI_MODEL: ${{ vars.HI_EVAL_MODEL }}
          HI_API_KEY: ${{ secrets.HI_EVAL_API_KEY }}
          HI_BASE_URL: ${{ vars.HI_EVAL_BASE_URL }}
        run: >-
          target/release/hi-eval bench
          --trials=3
          --artifacts=artifacts/eval

      - name: Enforce evaluation regression thresholds
        run: scripts/check_eval_regression.sh artifacts/eval eval-baseline/core-0.2.json

      - name: Upload every candidate artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-eval-${{ github.run_id }}
          path: artifacts/eval
          if-no-files-found: error
          retention-days: 90

  # Separate job and summary so outcome rates cannot be averaged with
  # process/budget. Replay stays in Core CI; this is the live tape.
  evaluate-harness:
    name: harness process + budget
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v5
        with:
          # Build the immediately preceding revision as the paired control.
          fetch-depth: 2
      - name: Install Linux build dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libasound2-dev
      - uses: dtolnay/rust-toolchain@1.96.0
      - uses: Swatinem/rust-cache@v2

      - name: Build core binaries
        run: cargo build --release -p hi -p hi-eval

      - name: Build preceding harness binary
        run: |
          git worktree add --detach "${RUNNER_TEMP}/hi-harness-baseline" HEAD^
          CARGO_TARGET_DIR="${RUNNER_TEMP}/hi-harness-baseline-target" \
            cargo build \
            --manifest-path "${RUNNER_TEMP}/hi-harness-baseline/Cargo.toml" \
            --release -p hi

      - name: Run harness suite (verify, one trial)
        env:
          HI_BIN: target/release/hi
          HI_MODEL: ${{ vars.HI_EVAL_MODEL }}
          HI_API_KEY: ${{ secrets.HI_EVAL_API_KEY }}
          HI_BASE_URL: ${{ vars.HI_EVAL_BASE_URL }}
          HI_STATE_DIR: ${{ runner.temp }}/hi-state
          HI_EVAL_CONCURRENCY: "2"
        run: >-
          target/release/hi-eval bench/harness
          --trials=1
          --configs=verify
          --artifacts=artifacts/harness

      - name: Run paired two-binary harness evaluation
        env:
          HI_MODEL: ${{ vars.HI_EVAL_MODEL }}
          HI_API_KEY: ${{ secrets.HI_EVAL_API_KEY }}
          HI_BASE_URL: ${{ vars.HI_EVAL_BASE_URL }}
          HI_STATE_DIR: ${{ runner.temp }}/hi-state-ab
          HI_EVAL_CONCURRENCY: "2"
        run: >-
          target/release/hi-eval ab bench/harness
          --baseline-bin="${RUNNER_TEMP}/hi-harness-baseline-target/release/hi"
          --candidate-bin="${GITHUB_WORKSPACE}/target/release/hi"
          --trials=1
          --configs=verify
          --artifacts=artifacts/harness-ab

      - name: Enforce harness process/budget gates
        run: scripts/check_harness_regression.sh artifacts/harness eval-baseline/harness.json

      - name: Upload harness artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: harness-eval-${{ github.run_id }}
          path: |
            artifacts/harness
            artifacts/harness-ab
          if-no-files-found: error
          retention-days: 90

  # First-tool routing. Separate summary so quality process_pass_rate cannot
  # be averaged with harness process/budget or SWE solve_rate.
  evaluate-quality:
    name: quality first-tool routing
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - name: Install Linux build dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libasound2-dev
      - uses: dtolnay/rust-toolchain@1.96.0
      - uses: Swatinem/rust-cache@v2

      - name: Build core binaries
        run: cargo build --release -p hi -p hi-eval

      - name: Run quality suite (baseline, one trial)
        env:
          HI_BIN: target/release/hi
          HI_MODEL: ${{ vars.HI_EVAL_MODEL }}
          HI_API_KEY: ${{ secrets.HI_EVAL_API_KEY }}
          HI_BASE_URL: ${{ vars.HI_EVAL_BASE_URL }}
          HI_STATE_DIR: ${{ runner.temp }}/hi-state
          HI_EVAL_CONCURRENCY: "2"
        run: >-
          target/release/hi-eval bench/quality
          --trials=1
          --configs=baseline
          --artifacts=artifacts/quality

      - name: Enforce quality process/budget gates
        run: scripts/check_quality_regression.sh artifacts/quality eval-baseline/quality.json

      - name: Upload quality artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-eval-${{ github.run_id }}
          path: artifacts/quality
          if-no-files-found: error
          retention-days: 90
