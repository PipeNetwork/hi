name: Core CI

on:
  push:
    branches: [main, master]
  pull_request:

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: core-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: format · lint · deterministic tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Linux build dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libasound2-dev
      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy (0.2 core only)
        run: >-
          cargo clippy
          -p hi-ai -p hi-tools -p hi-lsp -p hi-agent -p hi-pipefs
          -p hi-tui -p hi -p hi-eval -p hi-smoke
          --no-default-features
          --all-targets -- -A clippy::large-enum-variant -D warnings

      - name: Core tests
        run: >-
          cargo nextest run
          -p hi-ai -p hi-tools -p hi-lsp -p hi-agent -p hi-pipefs
          -p hi-tui -p hi -p hi-eval -p hi-smoke
          --no-default-features

      - name: Core doctests
        run: >-
          cargo test --doc
          -p hi-ai -p hi-tools -p hi-lsp -p hi-agent -p hi-pipefs
          -p hi-tui -p hi -p hi-eval -p hi-smoke
          --no-default-features

      - name: Voice feature compile
        run: cargo check -p hi --features voice

      - name: Codebase-graph feature compile
        run: cargo check -p hi --features codebase-graph

      - name: Validate benchmark task schemas and immutable oracles
        run: cargo run -p hi-eval -- bench --validate

      - name: Harness judge replay (no provider)
        run: scripts/check_harness_regression.sh

      - name: Evaluator hermetic/tamper-resistance tests
        run: cargo nextest run -p hi-eval

      - name: Fake-provider end-to-end outcome tests
        run: cargo nextest run -p hi --test memory_e2e --no-default-features

      - name: Orchestration concurrency and chaos tests
        run: >-
          cargo nextest run -p hi-tools background_tasks --no-default-features &&
          cargo nextest run -p hi-agent tests::background_task --no-default-features &&
          cargo nextest run -p hi resource_governor::tests --no-default-features &&
          cargo nextest run -p hi delegate_tests --no-default-features &&
          cargo nextest run -p hi bestof::tests --no-default-features

      - name: Orchestration regression benchmark
        env:
          HI_BENCH_BASELINE_1_MS: 100
          HI_BENCH_BASELINE_2_MS: 100
          HI_BENCH_BASELINE_4_MS: 100
          HI_BENCH_BASELINE_8_MS: 100
        run: cargo run -p hi -- --benchmark-orchestration

      - name: Trace hash-chain verification
        run: scripts/check_trace_verify.sh

      - name: Source file-size ratchet
        run: scripts/check_file_size.sh

  tui-smoke:
    name: interactive TUI smoke (provider-free)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HI_PIPE_WRAP: ${{ github.workspace }}/target/pipe-wrap/x86_64-unknown-linux-gnu/pipe-wrap
    steps:
      - uses: actions/checkout@v5
      - name: Install Linux build dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libasound2-dev
      - uses: dtolnay/rust-toolchain@1.96.0
      - uses: Swatinem/rust-cache@v2

      - name: Build Linux sandbox helper
        run: tools/build-pipe-wrap.sh

      - name: Enable unprivileged user namespaces
        run: |
          sudo sysctl -w kernel.unprivileged_userns_clone=1 2>/dev/null || true
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 2>/dev/null || true

      - name: Build TUI smoke binaries
        run: cargo build -p hi -p hi-smoke --no-default-features

      - name: Verify staged candidate survives the sandbox root pivot
        run: >-
          cargo test -p hi-smoke --no-default-features
          runner::tests::sandbox_staged_candidate_executes_inside_enforced_sandbox
          -- --ignored --exact

      - name: Validate TUI smoke scenarios
        run: target/debug/hi-smoke validate bench/tui-smoke

      - name: Run curated TUI smoke scenarios
        run: >-
          target/debug/hi-smoke run bench/tui-smoke
          --mode scripted
          --tag pr
          --artifacts artifacts/tui-smoke

      - name: Run fixed TUI chaos seeds
        run: >-
          target/debug/hi-smoke fuzz bench/tui-smoke
          --seed-start 0
          --seeds 12
          --jobs 4
          --artifacts artifacts/tui-smoke-fuzz

      - name: Upload TUI smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tui-smoke-pr-${{ github.run_id }}
          path: |
            artifacts/tui-smoke
            artifacts/tui-smoke-fuzz
          if-no-files-found: error
          retention-days: 30

  # PR CI is deliberately provider-free. Network/model-backed evaluation runs
  # only in the scheduled workflow and cannot make pull-request checks flaky.
