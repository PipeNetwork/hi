[workspace]
resolver = "3"
members = ["crates/*"]
default-members = ["crates/hi-cli"]
# pipe-wrap is an external Linux binary, cloned by tools/build-pipe-wrap.sh.
# Exclude it so `cargo build --manifest-path .cache/pipe-wrap-src/Cargo.toml`
# is not treated as a stray member of this workspace.
exclude = [".cache/pipe-wrap-src"]

# Keep the edit/compile loop responsive without removing useful backtraces
# from release artifacts. These profiles apply to every workspace crate.
[profile.dev]
debug = 1

[profile.test]
debug = 1

# Keep line information for the crate being edited, but do not emit it for
# every third-party dependency. This reduces parse/codegen and linker work in
# the normal edit/test loop while preserving useful local backtraces in the
# package under development.
[profile.dev.package."*"]
debug = 0

[profile.test.package."*"]
debug = 0

# Build scripts and proc-macros are implementation details; debug info there
# adds cost without helping application debugging.
[profile.dev.build-override]
debug = 0

[profile.test.build-override]
debug = 0

[workspace.package]
edition = "2024"
version = "0.3.1"

# Guardrail: forbid `unsafe` in every crate by default. Crates that legitimately
# use unsafe (mmap/alloc, libc kill, or test-only env set_var guards) opt out
# with `[lints.rust] unsafe_code = "allow"` in their own Cargo.toml and a
# comment naming the reason. Currently opted out: hi-cli, hi-eval, hi-tools,
# hi-tui (real unsafe) and hi-agent, hi-ai (test-only).
[workspace.lints.rust]
unsafe_code = "deny"

